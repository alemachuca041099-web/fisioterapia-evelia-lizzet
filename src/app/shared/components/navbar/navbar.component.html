<header
  class="w-full border-b border-[#e7dfc9] bg-[#fbf7ec]/80 backdrop-blur-xl transition-shadow duration-300"
  [class.shadow-[0_16px_50px_rgba(63,91,67,0.1)]]="isScrolled()"
>
  <div class="section-shell flex h-20 items-center justify-between gap-4">
    <a routerLink="/" class="nav-mark flex min-w-0 items-center gap-3" [attr.aria-label]="'Ir al inicio de ' + therapist.name">
      <div class="min-w-0">
        <p class="truncate font-display text-sm font-medium tracking-[-0.01em] text-[color:var(--color-primary)] sm:text-base">Fisio a Domicilio</p>
        <p class="truncate text-[0.65rem] uppercase tracking-[0.16em] text-[color:var(--color-muted)] sm:text-xs sm:tracking-[0.18em]">{{ therapist.name }}</p>
      </div>
    </a>

    <nav class="hidden items-center gap-6 lg:flex" aria-label="Navegación principal">
      <a
        routerLink="/"
        fragment="servicios"
        class="relative pb-2 text-sm font-medium text-[color:var(--color-text)] transition hover:text-[color:var(--color-primary)]"
      >Servicios</a>
      <a
        routerLink="/"
        fragment="contacto"
        class="relative pb-2 text-sm font-medium text-[color:var(--color-text)] transition hover:text-[color:var(--color-primary)]"
      >Contacto</a>
      <a
        routerLink="/"
        fragment="preguntas"
        class="relative pb-2 text-sm font-medium text-[color:var(--color-text)] transition hover:text-[color:var(--color-primary)]"
      >Preguntas</a>
    </nav>

    <div class="hidden items-center gap-3 lg:flex">
      <a class="btn-primary" [href]="whatsappLink" target="_blank" rel="noreferrer">
        <app-whatsapp-icon class="h-4 w-4" />
        Agenda al {{ therapist.whatsappDisplay }}
      </a>
    </div>

    <button
      class="relative inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-[#e7dfc9] bg-white text-[color:var(--color-text)] transition duration-300 ease-out hover:border-[#d9cfae] hover:bg-[#fbf7ec] focus:outline-none focus:ring-2 focus:ring-emerald-200 lg:hidden"
      [class.bg-\[color\:var\(--color-primary\)\]]="isMenuOpen()"
      [class.border-\[color\:var\(--color-primary\)\]]="isMenuOpen()"
      [class.text-white]="isMenuOpen()"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Abrir menú de navegación"
    >
      <span
        class="absolute h-0.5 w-5 rounded-full bg-current transition-all duration-300 ease-out"
        [ngClass]="isMenuOpen() ? 'translate-y-0 rotate-45' : '-translate-y-1.5'"
      ></span>
      <span
        class="absolute h-0.5 w-5 rounded-full bg-current transition-all duration-300 ease-out"
        [ngClass]="isMenuOpen() ? 'opacity-0' : 'opacity-100'"
      ></span>
      <span
        class="absolute h-0.5 w-5 rounded-full bg-current transition-all duration-300 ease-out"
        [ngClass]="isMenuOpen() ? 'translate-y-0 -rotate-45' : 'translate-y-1.5'"
      ></span>
    </button>
  </div>

  <aside
    class="fixed inset-0 z-[9999] flex h-[100dvh] min-h-[100dvh] w-screen max-w-none translate-x-full flex-col overflow-x-hidden overflow-y-auto bg-[#fbf7ec] px-5 pb-8 pt-24 transition duration-300 ease-out sm:px-6 lg:hidden"
    [class.translate-x-0]="isMenuOpen()"
    [class.translate-x-full]="!isMenuOpen()"
    [attr.aria-label]="'Menú móvil de ' + therapist.name"
  >
    <button
      type="button"
      (click)="closeMenu()"
      class="fixed right-4 top-4 z-[10000] inline-flex h-11 w-11 items-center justify-center rounded-full border border-[#e7dfc9] bg-[color:var(--color-primary)] text-white transition duration-300 ease-out hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-emerald-200"
      aria-label="Cerrar menú"
    >
      <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"></path>
      </svg>
    </button>

    <div class="mb-8 flex items-center gap-3 border-b border-[#e7dfc9] pb-5">
      <div class="min-w-0">
        <p class="truncate font-display text-base font-medium tracking-[-0.01em] text-[color:var(--color-primary)]">Fisio a Domicilio</p>
        <p class="truncate text-xs uppercase tracking-[0.18em] text-[color:var(--color-muted)]">{{ therapist.name }}</p>
      </div>
    </div>

    <div class="mb-6 text-center">
      <p class="eyebrow justify-center">Menú</p>
      <p class="mt-3 text-sm leading-7 text-[color:var(--color-muted)]">{{ therapist.location }}</p>
    </div>

    <nav class="grid flex-1 content-center gap-3" aria-label="Navegación principal móvil">
      <a routerLink="/" fragment="servicios" class="mx-auto w-full max-w-md rounded-2xl border border-transparent px-4 py-3 text-center font-display text-2xl font-medium tracking-[-0.01em] text-[color:var(--color-primary)] transition hover:border-[#e7dfc9] hover:bg-white" (click)="closeMenu()">Servicios</a>
      <a routerLink="/" fragment="contacto" class="mx-auto w-full max-w-md rounded-2xl border border-transparent px-4 py-3 text-center font-display text-2xl font-medium tracking-[-0.01em] text-[color:var(--color-primary)] transition hover:border-[#e7dfc9] hover:bg-white" (click)="closeMenu()">Contacto</a>
      <a routerLink="/" fragment="preguntas" class="mx-auto w-full max-w-md rounded-2xl border border-transparent px-4 py-3 text-center font-display text-2xl font-medium tracking-[-0.01em] text-[color:var(--color-primary)] transition hover:border-[#e7dfc9] hover:bg-white" (click)="closeMenu()">Preguntas</a>
    </nav>

    <div class="grid justify-items-center gap-5 border-t border-[#e7dfc9] pt-6">
      <a class="btn-primary w-full max-w-sm justify-center" [href]="whatsappLink" target="_blank" rel="noreferrer" (click)="closeMenu()">
        <app-whatsapp-icon class="h-4 w-4" />
        Agenda al {{ therapist.whatsappDisplay }}
      </a>
    </div>
  </aside>
</header>
