<footer class="border-t border-[#2f4432] bg-[#2c3f30] text-white">
  <div class="section-shell grid justify-items-center gap-8 pb-28 pt-14 text-center sm:py-16 lg:pb-16">
    <div class="grid justify-items-center gap-2">
      <p class="font-display text-2xl font-medium tracking-[-0.01em] text-white">Fisio a Domicilio</p>
      <p class="text-xs uppercase tracking-[0.2em] text-white/55">{{ therapist.name }} · {{ therapist.location }}</p>
    </div>

    <nav class="flex flex-wrap items-center justify-center gap-x-8 gap-y-2 text-sm" aria-label="Navegación de pie de página">
      <a class="text-white/75 transition hover:text-white" routerLink="/" fragment="servicios">Servicios</a>
      <a class="text-white/75 transition hover:text-white" routerLink="/" fragment="contacto">Contacto</a>
      <a class="text-white/75 transition hover:text-white" routerLink="/" fragment="preguntas">Preguntas</a>
      <a class="text-white/75 transition hover:text-white" [href]="whatsappLink" target="_blank" rel="noreferrer">WhatsApp</a>
    </nav>

    <a class="btn-primary" [href]="whatsappLink" target="_blank" rel="noreferrer">
      <app-whatsapp-icon class="h-4 w-4" />
      Agenda al {{ therapist.whatsappDisplay }}
    </a>

    <div class="w-full max-w-xs border-t border-white/10 pt-6">
      <p class="text-xs text-white/45">&copy; {{ year }} {{ therapist.name }} — Fisio a Domicilio</p>
    </div>
  </div>
</footer>
