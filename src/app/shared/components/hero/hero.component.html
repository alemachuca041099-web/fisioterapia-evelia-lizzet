<section class="page-hero">
  <div class="page-hero__bg" aria-hidden="true">
    <span class="page-hero__blob page-hero__blob--one"></span>
    <span class="page-hero__blob page-hero__blob--two"></span>
  </div>

  <div class="section-shell">
    <div class="page-hero__layout">
      <span class="eyebrow page-hero__eyebrow fade-up">{{ eyebrow }}</span>

      <h1 class="page-hero__title fade-up fade-up-delay">{{ title }}</h1>
      <p class="page-hero__location fade-up fade-up-delay">{{ location }}</p>

      @if (tags.length) {
        <div class="page-hero__tags fade-up fade-up-delay">
          @for (tag of tags; track tag) {
            <span class="pill-tag">{{ tag }}</span>
          }
        </div>
      }

      <div class="page-hero__tagline fade-up fade-up-delay">
        <p>{{ tagline }}</p>
        <p>{{ subtagline }}</p>
      </div>

      <a class="page-hero__cta fade-up fade-up-delay" [href]="primaryCtaHref" target="_blank" rel="noreferrer">
        <app-whatsapp-icon class="h-5 w-5" />
        {{ primaryCtaLabel }}
      </a>

      <div class="page-hero__portrait fade-up fade-up-delay" aria-hidden="true">
        <svg class="page-hero__leaf page-hero__leaf--left" viewBox="0 0 120 200" fill="none">
          <path d="M100 10C40 30 10 90 20 150c5 25 25 40 55 38-30-10-45-35-45-70 0-45 25-85 70-108Z" fill="currentColor"/>
        </svg>

        <div class="page-hero__frame-wrap">
          <span class="page-hero__ring" aria-hidden="true"></span>
          <div class="page-hero__frame">
            <img [src]="image" [alt]="imageAlt" class="page-hero__image" />
          </div>
        </div>

        <svg class="page-hero__leaf page-hero__leaf--right" viewBox="0 0 120 200" fill="none">
          <path d="M20 10c60 20 90 80 80 140-5 25-25 40-55 38 30-10 45-35 45-70 0-45-25-85-70-108Z" fill="currentColor"/>
        </svg>
      </div>
    </div>
  </div>
</section>
