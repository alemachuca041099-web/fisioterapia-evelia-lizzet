@if (showLoader()) {
  <div class="app-loader" [class.app-loader--leaving]="isLoaderLeaving()">
    <span class="app-loader__spinner" aria-hidden="true"></span>
    <strong class="app-loader__title">Fisio a Domicilio</strong>
    <span class="app-loader__eyebrow">LFT. Evelia Lizzet</span>
  </div>
}

<div class="app-shell" [class.app-shell--loading]="showLoader()">
  <app-navbar />
  <main class="app-main" [class.app-main--route-transitioning]="isRouteTransitioning()">
    <div class="app-main__page" [class.app-main__page--transitioning]="isRouteTransitioning()">
      <router-outlet />
    </div>
  </main>
  <app-footer />
  <app-scroll-top-button />
</div>

<app-whatsapp-chat-widget />
